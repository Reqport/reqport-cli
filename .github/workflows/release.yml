name: release

# Publish @reqport/cli to npm when a version tag (v*) is pushed — via npm OIDC
# Trusted Publishing. There is NO NPM_TOKEN and no shared secret to rotate: auth
# happens through GitHub Actions' OIDC id-token, which npm exchanges at publish
# time, and every release gets a signed provenance attestation.
#
# ONE-TIME setup on npmjs.com (as an owner of the @reqport org): open the
# @reqport/cli package -> Settings -> "Trusted Publisher" -> GitHub Actions, and
# enter:
#   Organization/repository: Reqport/reqport-cli
#   Workflow filename:       release.yml
#   Environment:             (leave blank)
# If the package does not exist yet, do ONE interactive bootstrap publish first
# (npm login && npm publish --access public), then add the trusted publisher —
# every release after that is token-free via this workflow.
#
# The pushed tag drives the publish and must match the version in package.json.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # REQUIRED: OIDC trusted publishing + provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5.1)
        # Pin to the 11.x line: npm@latest is 12.x which requires Node >= 22.22,
        # but this job runs Node 20. 11.x is >= 11.5.1 (OIDC-capable) and runs on Node 20.
        run: npm install -g npm@^11.5.1

      - name: Install
        run: npm ci

      # Until 2026-10-22 this job went straight from install to build to
      # publish. It never typechecked and it never ran the 101 tests in test/,
      # so a tag could put a broken build on npm under a Trusted Publishing
      # provenance attestation -- an attestation that says truthfully where the
      # artifact came from and nothing at all about whether it works.
      # `checks` runs these on every PR and on main; this is the last gate
      # before the artifact leaves the building.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish to npm (OIDC trusted publishing + provenance)
        run: npm publish --access public --provenance
